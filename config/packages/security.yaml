security:
    encoders:
        App\Entity\User:
            algorithm: auto
    enable_authenticator_manager: true
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        public:
            pattern: ^/(login|reset-password|test/email|logout)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthAuthenticator
            logout:
                path: app_logout
                target: app_login
                csrf_token_generator: security.csrf.token_manager
                csrf_token_id: logout
                invalidate_session: true
                delete_cookies:
                    PHPSESSID: { path: / }

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Public routes
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        
        # Profesor routes
        - { path: ^/profesor/dashboard, roles: [ROLE_PROFESOR, ROLE_ADMIN] }
        - { path: ^/profesor/asistencia, roles: [ROLE_PROFESOR, ROLE_ADMIN] }
        - { path: ^/profesor/curso, roles: [ROLE_PROFESOR, ROLE_ADMIN] }
        - { path: ^/asistencias/alumnos, roles: [ROLE_PROFESOR, ROLE_ADMIN] }
        
        # Admin routes
        - { path: ^/admin, roles: [ROLE_ADMIN, ROLE_ADMIN_INSTITUTO] }
        - { path: ^/instituto, roles: [ROLE_ADMIN_INSTITUTO, ROLE_ADMIN] }
        - { path: ^/instituto/config, roles: [ROLE_ADMIN_INSTITUTO, ROLE_ADMIN] }
        - { path: ^/instituto/profesor, roles: [ROLE_ADMIN_INSTITUTO, ROLE_ADMIN] }
        - { path: ^/instituto/curso, roles: [ROLE_ADMIN_INSTITUTO, ROLE_ADMIN] }
        - { path: ^/instituto/alumno, roles: [ROLE_ADMIN_INSTITUTO, ROLE_ADMIN] }
        - { path: ^/instituto/asistencia, roles: [ROLE_ADMIN_INSTITUTO, ROLE_ADMIN] }
        
        # Default access control
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
