# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    http_method_override: false

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
        # cookie_lifetime: 0 = cookie de sesión (expira al cerrar el navegador); la sesión en servidor expira por inactividad (gc_maxlifetime)
        cookie_lifetime: 0
        gc_maxlifetime: 2700     # 45 min de inactividad sin requests → se elimina la sesión en servidor

    # Detrás del nginx del servidor, que termina el TLS y le pasa el pedido al contenedor por
    # http plano. Sin esto Symfony cree que el sitio es http y arma todas las URLs absolutas con
    # ese esquema: los links de los mails salen en http y Mercado Pago rechaza las URLs que le
    # mandamos. Vacío por defecto, así en local no cambia nada.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    #esi: true
    #fragments: true
    php_errors:
        log: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
