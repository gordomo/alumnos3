monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Todo lo que tenga que ver con cobrar: avisos de Mercado Pago, facturas que se cancelan
        # solas. Va aparte porque el handler principal solo escribe cuando hay un error, y un
        # cobro que sale bien no deja rastro. Es justo lo que hay que poder auditar despues.
        - pagos

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!pagos"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                # La receta por defecto manda todo a stderr, que en este contenedor termina en el
                # log de Apache y hay que ir a buscarlo con "docker compose logs". Se usa un archivo
                # rotativo para poder hacer un tail de var/log/prod.log, que es donde cualquiera lo
                # va a buscar primero. 14 archivos: dos semanas de historia.
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 14
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            pagos:
                type: rotating_file
                channels: [pagos]
                path: "%kernel.logs_dir%/pagos.log"
                max_files: 90
                level: info
                formatter: monolog.formatter.json
            deprecation:
                # A su propio archivo y no a stderr: son avisos de librerias, no errores, y mandarlos
                # a stderr hacia que cada comando de consola escupiera cuatro bloques JSON entre
                # medio de su salida real.
                type: rotating_file
                channels: [deprecation]
                path: "%kernel.logs_dir%/deprecations.log"
                max_files: 3
                formatter: monolog.formatter.json
