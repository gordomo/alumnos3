# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Por dónde nos contactan los institutos. Se usan en el formulario público, en los carteles
    # de suspensión y en el aviso interno de una solicitud nueva.
    # La URL publica del sistema, tal cual la ve un navegador. Se usa para armar los enlaces que
    # tienen que funcionar desde afuera -los que recibe Mercado Pago- sin depender de lo que
    # diga el request: detras del nginx del servidor el pedido llega por http plano y Symfony
    # genera http://, que Mercado Pago rechaza.
    app.url: '%env(APP_URL)%'

    # Qué producto es esta instalación: 'instituto' (Team Builder Institute) o 'club'
    # (Team Builder Clubes). Es el mismo código; cambia la paleta, la landing y el vocabulario.
    app.vertical: '%env(default:vertical_por_defecto:APP_VERTICAL)%'
    vertical_por_defecto: 'instituto'

    app.email_contacto: 'contacto@teambuilder.com.ar'
    app.whatsapp_contacto: '5493416043603'
    app.whatsapp_contacto_visible: '+54 9 341 604-3603'

    logos_directory: '%kernel.project_dir%/public/uploads/logos'
    payment_proofs_directory: '%kernel.project_dir%/public/uploads/payment_proofs'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: false

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            # Las fixtures dependen de doctrine/doctrine-fixtures-bundle, que es una dependencia de
            # desarrollo. Sin esta exclusión, un "composer install --no-dev" deja el contenedor sin
            # poder compilar ("class Doctrine\Bundle\FixturesBundle\Fixture not found") y el sitio
            # se cae entero. El esqueleto de Symfony la trae por defecto; acá faltaba.
            - '../src/DataFixtures/'
            # SeedDatabaseCommand recibe el seeder, así que arrastra la misma dependencia dev.
            - '../src/Command/SeedDatabaseCommand.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

# Las fixtures solo existen en desarrollo: el bundle que necesitan es una dependencia dev, así que
# declararlas siempre rompía el contenedor cuando se instalaba con --no-dev.
when@dev:
    services:
        # Este bloque no hereda el _defaults de arriba: es otra sección de servicios y hay que
        # repetirlo, o estas dos clases quedan sin autowiring y el contenedor no compila.
        _defaults:
            autowire: true
            autoconfigure: true
            public: false

        App\Command\SeedDatabaseCommand:
            tags: ['console.command']

        App\DataFixtures\UserSeeder:
            tags: ['doctrine.fixture.orm']
            public: true
            arguments:
                $passwordHasher: '@security.password_hasher'
