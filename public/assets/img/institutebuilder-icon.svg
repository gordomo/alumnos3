  </defs>
  <!-- Base: cuadrado/documento (teal) -->
  <rect x="8" y="28" width="48" height="28" rx="4" fill="url(#teal)"/>
  <rect x="16" y="36" width="32" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>
  <rect x="16" y="42" width="24" height="2" rx="1" fill="rgba(255,255,255,0.2)"/>
  <!-- Cubo isométrico (accent) - bloque de construcción -->
  <path d="M20 20 L38 8 L38 28 L20 40 Z" fill="url(#accent)"/>
