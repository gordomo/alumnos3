services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html # <-- Volumen compartido
    networks:
      - symfony-network
    depends_on:
      - db

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: 1ajd2OnnauhGfvlURTg2
      MYSQL_DATABASE: dreams
      MYSQL_USER: dreams_usr
      MYSQL_PASSWORD: 1ajd2OnnauhGfvlURTg2
    ports:
      - "3306:3306"
    networks:
      - symfony-network
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: 1ajd2OnnauhGfvlURTg2
      MYSQL_DATABASE: dreams
    networks:
      - symfony-network

volumes:
  db_data:

networks:
  symfony-network: